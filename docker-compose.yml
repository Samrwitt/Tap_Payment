services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      PORT: 8080
      BASE_URL: http://localhost:8080
      SQLITE_PATH: /data/payments.db
      # Set these in your local environment before testing real Tap charges:
      TAP_SECRET_KEY: ""
      TAP_WEBHOOK_SECRET_KEY: ""
      TAP_WEBHOOK_URL: http://localhost:8080/api/payments/webhooks/tap
    volumes:
      - ./backend/data:/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/healthz"]
      interval: 10s
      timeout: 3s
      retries: 10

